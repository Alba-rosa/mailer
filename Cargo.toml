[package]
name = "mailer"
version = "0.0.1-alpha"
edition = "2024"
rust-version = "1.88"
description = "A simple email client that looks like a messenger app"
license = "MIT"
repository = "https://github.com/Alba-rosa/mailer"
readme = "README.md"
keywords = ["email", "imap", "smtp", "egui", "gui"]
categories = ["email", "gui"]

[dependencies]
chrono = "0.4"
directories = "6"
eframe = "0.37"
hickory-resolver = "0.26"
html2text = "0.17"
imap = "3.0.0-alpha.15"
imap-proto = "0.16"
keyring = "4"
lettre = "0.11"
mail-parser = "1"
open = "5"
roxmltree = "0.21"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[profile.release]
lto = "thin"
strip = true
